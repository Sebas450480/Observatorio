name: Pruebas

on:
  pull_request:
  push:
    branches: [pruebas, produccion, main]

jobs:
  base-de-datos:
    name: Base de datos (schema.sql + pruebas SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: schema.sql está al día con las migraciones
        run: |
          bash supabase/generar_schema.sh
          git diff --exit-code supabase/schema.sql
      - name: Crear la base desde cero y cargar los datos iniciales
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Pruebas de permisos e integridad
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/pruebas_base_datos.sql

  backend:
    name: Backend (lint, tipos, pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
