      responses: { '200': { description: Nombres } }
  /api/flash/plantilla:
    get:
      tags: [Flash Informativo]
      summary: Plantilla de carga masiva (hojas de registros, instrucciones y listas; Gestor Flash Informativo o SuperAdmin)
      responses: { '200': { $ref: '#/components/responses/Archivo' } }
  /api/flash/importar:
    post:
      tags: [Flash Informativo]
      summary: Carga masiva desde Excel, máximo 50 registros, todo o nada
      description: >
        Con ?validar=1 solo revisa el archivo y devuelve { total, validos, errores: [{ fila, columna, mensaje }], registros: [{ fila, resumen }] }.
        Sin ese parámetro guarda todos los registros o ninguno.
      parameters: [{ name: validar, in: query, schema: { type: string, enum: ['1', 'true'] } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { archivo: { type: string, format: binary } } }
      responses:
        '200': { description: 'Revisión del archivo (con ?validar=1)' }
        '201': { description: 'Guardado: { importados: n }' }
        '415': { description: El archivo no es un Excel (.xlsx) }
        '422': { description: 'Errores por fila y columna, más de 50 registros o encabezados distintos a la plantilla; no se guarda nada', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/faro/plantilla:
    get:
      tags: [Faro]
      summary: Plantilla de carga masiva (hojas de registros, instrucciones y listas; Gestor Faro o SuperAdmin)
