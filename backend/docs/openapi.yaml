  # ------------------------------------------------------------------ Invitaciones
  /api/invitaciones:
    get:
      tags: [Invitaciones]
      summary: Invitaciones enviadas (estado Pendiente, Vencida, Completada o Anulada)
      responses:
        '200': { description: '[{ id_invitacion, nombre_contacto, apellido_contacto, correo, nombre_empresa, id_ec, estado, fecha_envio, fecha_vencimiento, fecha_completada }]' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Invitaciones]
      summary: Invitar una empresa (envía el correo con el enlace de registro, vigente 7 días)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_contacto, apellido_contacto, correo]
              properties:
                nombre_contacto: { type: string, maxLength: 50 }
                apellido_contacto: { type: string, maxLength: 50 }
                correo: { type: string, format: email }
                nombre_empresa: { type: string, maxLength: 150, nullable: true }
      responses:
        '201': { description: 'Invitación creada; correo_enviado indica si el correo salió' }
        '409': { description: El correo ya tiene cuenta o una invitación pendiente }
  /api/invitaciones/lote:
    post:
      tags: [Invitaciones]
      summary: Invitar varias empresas a la vez (máximo 50); las que fallan no detienen las demás
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitaciones]
              properties:
                invitaciones:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [nombre_contacto, apellido_contacto, correo]
                    properties:
                      nombre_contacto: { type: string, maxLength: 50 }
                      apellido_contacto: { type: string, maxLength: 50 }
                      correo: { type: string, format: email }
                      nombre_empresa: { type: string, maxLength: 150, nullable: true }
      responses:
        '200': { description: '{ enviadas, resultados: [{ correo, ok, invitacion | error }] }' }
  /api/invitaciones/{id}/reenviar:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Invitaciones]
      summary: Reenviar con un enlace nuevo (el anterior deja de servir)
      responses: { '200': { description: Invitación reenviada }, '409': { description: No está pendiente } }
  /api/invitaciones/{id}/anular:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Invitaciones]
      summary: Anular (el enlace deja de servir)
      responses: { '200': { description: Invitación anulada }, '409': { description: No está pendiente } }
  /api/invitaciones/codigo/{codigo}:
    get:
      tags: [Invitaciones]
      summary: Datos de la invitación del enlace del correo (sin sesión)
      security: []
      parameters: [{ name: codigo, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ nombre_contacto, apellido_contacto, correo, nombre_empresa, fecha_vencimiento }' }
        '404': { description: El enlace no es válido, ya se usó o venció }
  /api/invitaciones/completar:
    post:
      tags: [Invitaciones]
      summary: La empresa crea su contraseña (crea la cuenta y la empresa pendiente e inicia sesión)
      description: >
        Registro corto: solo la contraseña. La empresa queda Inactiva con NIT provisional
        (PENDIENTE-<id_invitacion>) hasta que complete su ficha en PATCH /api/mi-empresa;
        al guardar el NIT real queda publicada (Activo).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, contrasena, acepta_tratamiento_datos]
              properties:
                codigo: { type: string }
                contrasena: { type: string, minLength: 8, maxLength: 72 }
                acepta_tratamiento_datos: { type: boolean, enum: [true] }
      responses:
        '201': { description: '{ id_ec, usuario } y cookie de sesión' }
        '400': { description: Datos inválidos o enlace vencido }
        '409': { description: Correo ya registrado }

  # ------------------------------------------------------------------ Mi empresa
  /api/mi-empresa:
    get:
      tags: [Mi empresa]
      summary: Ficha de mi empresa (incluye correo_cuenta, el correo de la invitación, y pendiente si aún no completa la ficha)
      responses:
        '200': { description: Empresa }
        '403': { description: La cuenta no tiene el rol Empresa Coformadora }
        '404': { description: La cuenta no está ligada a una empresa }
    patch:
      tags: [Mi empresa]
      summary: Editar mi empresa (el estado lo maneja el Observatorio)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razon_social: { type: string }
                nombre_comercial: { type: string, nullable: true }
                nit: { type: string }
                sector_economico: { type: string }
                descripcion: { type: string, nullable: true }
                tamano_empresa: { type: string, enum: [Micro, Pequeña, Mediana, Grande], nullable: true }
                anio_constitucion: { type: integer, nullable: true }
                estudiantes_recibidos: { type: integer, minimum: 0 }
                link: { type: string, nullable: true }
                telefono: { type: string, nullable: true }
                correo: { type: string, nullable: true }
                departamento: { type: string }
                municipio: { type: string }
                direccion: { type: string, nullable: true }
      responses:
        '200': { description: Empresa actualizada (si estaba pendiente y se guarda la ficha completa, queda publicada) }
        '400': { description: Datos inválidos o faltan los obligatorios de una ficha pendiente }
        '409': { description: NIT ya registrado }
  /api/mi-empresa/imagen/{campo}:
    parameters: [{ name: campo, in: path, required: true, schema: { type: string, enum: [logo_ec, imagen_portada] } }]
    post:
      tags: [Mi empresa]
      summary: Subir logo o portada (JPG o PNG)
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { imagen: { type: string, format: binary } } } } } }
      responses: { '201': { description: Imagen guardada } }
    delete:
      tags: [Mi empresa]
      summary: Quitar logo o portada
      responses: { '204': { description: Imagen quitada } }

  # ------------------------------------------------------------------ Glosario
  /api/glosario:
    get:
      tags: [Glosario]
      summary: Listar términos (el público ve solo los activos)
      parameters:
        - $ref: '#/components/parameters/q'
        - { name: letra, in: query, description: 'Inicial del término (A-Z, Ñ) o # para números y símbolos', schema: { type: string } }
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses: { '200': { $ref: '#/components/responses/Pagina' } }
    post:
      tags: [Glosario]
      summary: Crear término
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termino, definicion]
              properties:
                termino: { type: string, maxLength: 120 }
                definicion: { type: string }
                fuente: { type: string, nullable: true }
                estado_gt: { type: string, enum: [Activo, Inactivo] }
      responses: { '201': { description: Término creado }, '409': { description: El término ya existe } }
  /api/glosario/letras:
    get:
      tags: [Glosario]
      summary: Letras iniciales que tienen términos (índice A-Z)
      responses: { '200': { description: '["A", "C", "#"]' } }
