openapi: 3.0.3
info:
  title: API Observatorio Empresarial
  version: 1.0.0
  description: |
    API REST del Observatorio Empresarial (Uniempresarial).

    **Sesión.** `POST /api/auth/login` deja una cookie `obs_sesion` (HttpOnly). También se acepta
    `Authorization: Bearer <token>`. Sin sesión, las peticiones se atienden como **Invitado**.

    **Permisos.** Cada petición se ejecuta en PostgreSQL con el rol del usuario:
    Invitado y Usuario solo ven registros **activos** y no ven el campo de estado; cada gestor
    administra su módulo; el Super Admin y el Gestor Observatorio administran todo.

    **Errores.** Respuesta `{ "error": "mensaje", "detalles": ... }` con el código HTTP correspondiente
    (400 datos inválidos, 401 sin sesión, 403 sin permiso, 404 no existe, 409 duplicado, 413/415 archivo, 422 importación).
servers:
  - url: /
tags:
  - name: Autenticación
  - name: Mi perfil
  - name: Favoritos
    description: Usuarios registrados; cada uno ve solo los suyos.
  - name: Usuarios
    description: Super Admin y Gestor Observatorio.
  - name: Catálogos
  - name: Flash Informativo
  - name: Faro
  - name: Empresas Coformadoras
  - name: Invitaciones
    description: 'Registro de empresas coformadoras por invitación. Gestión: Super Admin, Gestor Observatorio y Gestor Empresas.'
  - name: Mi empresa
    description: Solo cuentas con el rol Empresa Coformadora; editan la ficha de su propia empresa.
  - name: Tendencias
  - name: Calendario
  - name: Glosario
    description: Términos y conceptos clave. Lo administran el Super Admin, el Gestor Observatorio y el Gestor Glosario.
  - name: Estadísticas
  - name: Alertas
  - name: Búsqueda
components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: obs_sesion
    bearer:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    direccion:
      name: direccion
      in: query
      schema: { type: string, enum: [asc, desc] }
    estado:
      name: estado
      in: query
      description: Solo para el gestor del módulo, el Super Admin y el Gestor Observatorio.
      schema: { type: string, enum: [Activo, Inactivo] }
    categoria:
      name: categoria
      in: query
      description: Id de categoría; se puede repetir.
      schema: { type: array, items: { type: integer } }
      style: form
      explode: true
    q:
      name: q
      in: query
      description: Búsqueda de texto.
      schema: { type: string }
    formato:
      name: formato
      in: query
      schema: { type: string, enum: [xlsx, pdf], default: xlsx }
    campoImagen:
      name: campo
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        detalles: {}
    Pagina:
      type: object
      properties:
        datos: { type: array, items: { type: object } }
        total: { type: integer }
        pagina: { type: integer }
        limite: { type: integer }
        paginas: { type: integer }
    Categoria:
      type: object
      properties:
        id_categoria: { type: integer }
        nombre: { type: string }
    Perfil:
      type: object
      properties:
        id_usuario: { type: integer }
        apodo_usuario: { type: string, nullable: true }
        nombre_usuario: { type: string }
        apellido_usuario: { type: string }
        correo: { type: string }
        ciudad: { type: string, nullable: true }
        frecuencia_alertas: { type: string, enum: [Inmediata, Semanal, Ninguna] }
        estado_usuario: { type: string, enum: [Activo, Inactivo] }
        id_rol: { type: integer, description: Rol principal (el de más alcance) }
        nombre_rol: { type: string }
        roles:
          type: array
          description: Todos los roles de la cuenta (una cuenta puede tener varios)
          items: { type: object, properties: { id_rol: { type: integer }, nombre_rol: { type: string } } }
        rol_activo:
          type: string
          nullable: true
          description: "Cuentas con varios roles: rol con el que entró y actúa (null si la cuenta tiene un solo rol)"
        intereses: { type: array, items: { $ref: '#/components/schemas/Categoria' } }
    Flash:
      type: object
      required: [titulo, fecha_inicio, modalidad, tipo_evento]
      properties:
        titulo: { type: string, maxLength: 150 }
        descripcion: { type: string, nullable: true }
        fecha_inicio: { type: string, format: date-time, example: '2026-10-20T08:00:00-05:00' }
        fecha_fin: { type: string, format: date-time, nullable: true }
        modalidad: { type: string, enum: [Virtual, Presencial, Hibrido] }
        costo: { type: number, nullable: true }
        es_gratuito: { type: boolean }
        lugar: { type: string, nullable: true }
        link: { type: string, format: uri, nullable: true }
        info_adicional: { type: string, nullable: true, description: Información clave en viñetas. }
        tipo_evento: { type: string, enum: [Congreso, Hackathon, Foro, Cumbre, Seminario, Taller, Feria, Otro] }
        departamento: { type: string, nullable: true }
        estado_fi: { type: string, enum: [Activo, Inactivo] }
        categorias: { type: array, items: { type: integer } }
    Faro:
      type: object
      required: [titulo, tipo]
      properties:
        titulo: { type: string, maxLength: 150 }
        descripcion: { type: string, nullable: true }
        tipo: { type: string, enum: [Becas, Convocatorias, Cursos, Talleres] }
        fecha_publicacion: { type: string, format: date }
        fecha_inicio: { type: string, format: date, nullable: true }
        fecha_cierre: { type: string, format: date, nullable: true }
        entidad: { type: string, nullable: true }
        dirigida_a: { type: string, nullable: true }
        link: { type: string, format: uri, nullable: true }
        modalidad: { type: string, enum: [Virtual, Presencial, Hibrido], nullable: true }
        lugar: { type: string, nullable: true }
        costo: { type: number, nullable: true }
        es_gratuito: { type: boolean }
        duracion: { type: string, nullable: true }
        estado_fe: { type: string, enum: [Activo, Inactivo] }
        categorias: { type: array, items: { type: integer } }
    Empresa:
      type: object
      required: [nit, razon_social, sector_economico, departamento, municipio]
      properties:
        nit: { type: string }
        razon_social: { type: string }
        nombre_comercial: { type: string, nullable: true }
        descripcion: { type: string, nullable: true }
        sector_economico: { type: string }
        tamano_empresa: { type: string, enum: [Micro, Pequeña, Mediana, Grande], nullable: true }
        tiempo_coformadora: { type: string, nullable: true }
        link: { type: string, format: uri, nullable: true }
        estudiantes_recibidos: { type: integer }
        premios_recibidos: { type: integer }
        codigo_ciiu: { type: string, nullable: true }
        naturaleza_juridica: { type: string, nullable: true }
        departamento: { type: string }
        municipio: { type: string }
        direccion: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }
        anio_constitucion: { type: integer, nullable: true }
        estado_ec: { type: string, enum: [Activo, Inactivo] }
    Contacto:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        cargo: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }
        telefono: { type: string, nullable: true }
        es_principal: { type: boolean }
    Tendencia:
      type: object
      required: [megatendencia, tendencia]
      properties:
        megatendencia: { type: string, maxLength: 60 }
        tendencia: { type: string, maxLength: 80 }
        descripcion: { type: string, nullable: true }
        comportamiento_mundo: { type: string, nullable: true }
        comportamiento_colombia: { type: string, nullable: true }
        fecha_publicacion: { type: string, format: date }
        estado_te: { type: string, enum: [Activo, Inactivo] }
        categorias: { type: array, items: { type: integer } }
        fuentes:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              link: { type: string, format: uri, nullable: true }
    Evento:
      type: object
      required: [titulo, fecha_inicio, modalidad, tipo_evento]
      properties:
        titulo: { type: string }
        descripcion: { type: string, nullable: true }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: string, format: date-time, nullable: true }
        modalidad: { type: string, enum: [Virtual, Presencial, Hibrido] }
        lugar: { type: string, nullable: true }
        link_externo: { type: string, format: uri, nullable: true }
        tipo_evento: { type: string, enum: [Congreso, Hackathon, Foro, Cumbre, Seminario, Taller, Feria, Otro] }
        costo: { type: number, nullable: true }
        es_gratuito: { type: boolean }
  requestBodies:
    Imagen:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              imagen: { type: string, format: binary, description: JPG o PNG, máximo 4 MB. }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Pagina:
      description: Listado paginado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pagina' }
    Archivo:
      description: Archivo Excel o PDF
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
        application/pdf: {}
    SinContenido:
      description: Hecho, sin contenido
security:
  - {}
  - cookieSesion: []
  - bearer: []
paths:
  /api/salud:
    get:
      summary: Estado del servidor, de la base de datos y del correo (SMTP configurado o no)
      responses: { '200': { description: OK } }

  # ------------------------------------------------------------------ Autenticación
  /api/auth/registro:
    post:
      tags: [Autenticación]
      summary: Registro en dos pasos (datos e intereses) con rol Usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_usuario, apellido_usuario, correo, contrasena, acepta_tratamiento_datos]
              properties:
                nombre_usuario: { type: string }
                apellido_usuario: { type: string }
                apodo_usuario: { type: string }
                correo: { type: string, format: email }
                contrasena: { type: string, minLength: 8 }
                ciudad: { type: string }
                acepta_tratamiento_datos: { type: boolean, enum: [true], description: Ley 1581 de 2012 }
                intereses: { type: array, items: { type: integer } }
                frecuencia_alertas: { type: string, enum: [Inmediata, Semanal, Ninguna] }
      responses:
        '201': { description: Cuenta creada y sesión iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/Perfil' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo: { type: string }
                contrasena: { type: string }
                recordar: { type: boolean, default: true, description: 'Si es false, la sesión termina al cerrar el navegador.' }
      responses:
        '200': { description: Sesión iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/Perfil' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      responses: { '204': { $ref: '#/components/responses/SinContenido' } }
  /api/auth/yo:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión actual
      responses:
        '200': { description: Perfil, content: { application/json: { schema: { $ref: '#/components/schemas/Perfil' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/rol:
    post:
      tags: [Autenticación]
      summary: Elegir o cambiar el rol con el que se usa la plataforma (cuentas con varios roles)
      description: "Al iniciar sesión, una cuenta con varios roles entra con el principal; con este servicio elige con cuál seguir. La sesión actúa solo con ese rol hasta que lo cambie o cierre sesión."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [rol], properties: { rol: { type: string, example: Gestor Flash Informativo } } } } }
      responses:
        '200': { description: Perfil con el rol elegido, content: { application/json: { schema: { $ref: '#/components/schemas/Perfil' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/recuperar:
    post:
      tags: [Autenticación]
      summary: Enviar enlace para restablecer la contraseña
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [correo], properties: { correo: { type: string } } } } }
      responses: { '200': { description: Respuesta igual exista o no el correo } }
  /api/auth/restablecer:
    post:
      tags: [Autenticación]
      summary: Crear nueva contraseña con el código del enlace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, contrasena]
              properties:
                codigo: { type: string }
                contrasena: { type: string, minLength: 8 }
      responses:
        '200': { description: Contraseña actualizada }
        '400': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ Mi perfil
  /api/perfil:
    get:
      tags: [Mi perfil]
      summary: Ver mi perfil
      responses: { '200': { description: Perfil, content: { application/json: { schema: { $ref: '#/components/schemas/Perfil' } } } } }
    patch:
      tags: [Mi perfil]
      summary: Editar mi perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apodo_usuario: { type: string }
                nombre_usuario: { type: string }
                apellido_usuario: { type: string }
                correo: { type: string }
                ciudad: { type: string }
                frecuencia_alertas: { type: string, enum: [Inmediata, Semanal, Ninguna] }
      responses: { '200': { description: Perfil actualizado } }
  /api/perfil/intereses:
    put:
      tags: [Mi perfil]
      summary: Reemplazar mis intereses
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { intereses: { type: array, items: { type: integer } } } } } }
      responses: { '200': { description: Perfil actualizado } }
  /api/perfil/contrasena:
    put:
      tags: [Mi perfil]
      summary: Cambiar mi contraseña (cierra las demás sesiones)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [actual, nueva], properties: { actual: { type: string }, nueva: { type: string } } }
      responses: { '200': { description: Contraseña actualizada }, '400': { $ref: '#/components/responses/Error' } }

  # ------------------------------------------------------------------ Favoritos
  /api/favoritos:
    get:
      tags: [Favoritos]
      summary: Mis favoritos con sus datos y categorías
      responses:
        '200': { description: '[{ tipo_contenido, id_contenido, fecha_guardado, titulo, detalle, fecha, imagen, categorias, en_intereses }]' }
        '401': { $ref: '#/components/responses/Error' }
  /api/favoritos/claves:
    get:
      tags: [Favoritos]
      summary: 'Claves "Tipo:id" de mis favoritos'
      responses: { '200': { description: 'Ejemplo: ["Flash:3", "Empresa:7"]' } }
  /api/favoritos/{tipo}/{id}:
    parameters:
      - { name: tipo, in: path, required: true, schema: { type: string, enum: [Flash, Faro, Empresa, Tendencia, Evento] } }
      - $ref: '#/components/parameters/id'
    put:
      tags: [Favoritos]
      summary: Guardar en favoritos
      responses: { '200': { description: Guardado }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Favoritos]
      summary: Quitar de favoritos
      responses: { '200': { description: Quitado } }

  # ------------------------------------------------------------------ Usuarios
  /api/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      parameters:
        - $ref: '#/components/parameters/q'
        - { name: id_rol, in: query, description: Cuentas que tienen este rol (entre todos sus roles), schema: { type: integer } }
        - { name: orden, in: query, description: Columna por la que se ordena (por defecto, los más recientes), schema: { type: string, enum: [id, apodo, nombre, apellido, correo, ciudad, rol, estado, registro] } }
        - $ref: '#/components/parameters/direccion'
        - $ref: '#/components/parameters/estado'
        - { name: ciudad, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses: { '200': { $ref: '#/components/responses/Pagina' } }
    post:
      tags: [Usuarios]
      summary: Crear un usuario con uno o varios roles (solo un Super Admin asigna Super Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_usuario, apellido_usuario, correo, contrasena, roles, acepta_tratamiento_datos]
              properties:
                nombre_usuario: { type: string }
                apellido_usuario: { type: string }
                apodo_usuario: { type: string }
                correo: { type: string }
                contrasena: { type: string }
                ciudad: { type: string }
                roles: { type: array, minItems: 1, items: { type: integer }, description: 'Ids de los roles (id_rol, un solo rol, también se acepta)' }
                intereses: { type: array, items: { type: integer } }
                acepta_tratamiento_datos: { type: boolean, enum: [true] }
      responses: { '201': { description: Usuario creado } }
  /api/usuarios/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Usuarios]
      summary: Ver un usuario
      responses: { '200': { description: Usuario }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Usuarios]
      summary: Cambiar roles, estado o datos de un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles: { type: array, minItems: 1, items: { type: integer }, description: La cuenta queda exactamente con estos roles }
                estado_usuario: { type: string, enum: [Activo, Inactivo] }
                nombre_usuario: { type: string }
                apellido_usuario: { type: string }
                apodo_usuario: { type: string }
                ciudad: { type: string }
      responses: { '200': { description: Usuario actualizado } }
    delete:
      tags: [Usuarios]
      summary: Eliminar un usuario
      responses: { '204': { $ref: '#/components/responses/SinContenido' } }

  # ------------------------------------------------------------------ Catálogos
  /api/roles:
    get:
      tags: [Catálogos]
      summary: Listar roles
      responses: { '200': { description: Roles } }
  /api/categorias:
    get:
      tags: [Catálogos]
      summary: Listar categorías (intereses y etiquetas)
      responses: { '200': { description: Categorías } }
    post:
      tags: [Catálogos]
      summary: Crear categoría (Super Admin o Gestor Observatorio)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [nombre_categoria], properties: { nombre_categoria: { type: string } } } } }
      responses: { '201': { description: Creada } }
  /api/categorias/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [Catálogos]
      summary: Renombrar categoría (Super Admin o Gestor Observatorio)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [nombre_categoria], properties: { nombre_categoria: { type: string } } } } }
      responses: { '200': { description: Actualizada } }
    delete:
      tags: [Catálogos]
      summary: Eliminar categoría (Super Admin o Gestor Observatorio)
      responses: { '204': { $ref: '#/components/responses/SinContenido' } }

  # ------------------------------------------------------------------ Flash Informativo
  /api/flash:
    get:
      tags: [Flash Informativo]
      summary: Listar
      parameters:
        - $ref: '#/components/parameters/q'
        - { name: tipo_evento, in: query, schema: { type: string } }
        - { name: modalidad, in: query, schema: { type: string } }
        - { name: departamento, in: query, schema: { type: string } }
        - { name: gratuito, in: query, schema: { type: boolean } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/categoria'
        - $ref: '#/components/parameters/estado'
        - { name: orden, in: query, schema: { type: string, enum: [fecha, titulo, creacion] } }
        - $ref: '#/components/parameters/direccion'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses: { '200': { $ref: '#/components/responses/Pagina' } }
    post:
      tags: [Flash Informativo]
      summary: Crear (Gestor Flash Informativo o administración)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Flash' } } } }
      responses: { '201': { description: Creado } }
  /api/flash/exportar:
    get:
      tags: [Flash Informativo]
      summary: Exportar el listado (mismos filtros; requiere sesión)
      parameters: [{ $ref: '#/components/parameters/formato' }]
      responses: { '200': { $ref: '#/components/responses/Archivo' }, '401': { description: Sin sesión } }
  /api/flash/{id}/exportar:
    get:
      tags: [Flash Informativo]
      summary: 'Descargar la ficha de un registro en PDF (por defecto) o Excel; requiere sesión. También existe en /api/faro, /api/empresas, /api/tendencias y /api/calendario'
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/formato' }]
      responses: { '200': { $ref: '#/components/responses/Archivo' }, '401': { description: Sin sesión }, '404': { description: No existe } }
  /api/flash/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Flash Informativo]
      summary: Detalle
      responses: { '200': { description: Detalle }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Flash Informativo]
      summary: Editar (campos parciales)
