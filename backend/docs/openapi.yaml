        Sin ese parámetro guarda todos los registros o ninguno. Cada fila crea la empresa inactiva (ficha pendiente), su contacto principal y la invitación; los datos del contacto son obligatorios.
      parameters: [{ name: validar, in: query, schema: { type: string, enum: ['1', 'true'] } }]
      requestBody:
