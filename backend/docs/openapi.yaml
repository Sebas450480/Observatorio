        '201': { description: 'Guardado: { importados: n, invitaciones_enviadas: n, correos_fallidos: [] }' }
        '415': { description: El archivo no es un Excel (.xlsx) }
        '422': { description: 'Errores por fila y columna, más de 50 registros o encabezados distintos a la plantilla; no se guarda nada', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
