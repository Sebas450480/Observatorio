  /api/glosario/plantilla:
    get:
      tags: [Glosario]
      summary: Plantilla de carga masiva (hojas de registros, instrucciones y listas; Gestor Glosario o SuperAdmin)
      responses: { '200': { $ref: '#/components/responses/Archivo' } }
  /api/glosario/importar:
    post:
      tags: [Glosario]
      summary: Carga masiva desde Excel, máximo 50 registros, todo o nada
      description: >
        Con ?validar=1 solo revisa el archivo y devuelve { total, validos, errores: [{ fila, columna, mensaje }], registros: [{ fila, resumen }] }.
        Sin ese parámetro guarda todos los registros o ninguno.
      parameters: [{ name: validar, in: query, schema: { type: string, enum: ['1', 'true'] } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { archivo: { type: string, format: binary } } }
      responses:
        '200': { description: 'Revisión del archivo (con ?validar=1)' }
        '201': { description: 'Guardado: { importados: n }' }
        '415': { description: El archivo no es un Excel (.xlsx) }
        '422': { description: 'Errores por fila y columna, más de 50 registros o encabezados distintos a la plantilla; no se guarda nada', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/tendencias/exportar:
    get:
      tags: [Tendencias]
      summary: Exportar
      parameters: [{ $ref: '#/components/parameters/formato' }]
      responses: { '200': { $ref: '#/components/responses/Archivo' } }
  /api/tendencias/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { tags: [Tendencias], summary: Detalle, responses: { '200': { description: Detalle } } }
    patch:
      tags: [Tendencias]
      summary: Editar (si se envía "fuentes", reemplaza todas)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Tendencia' } } } }
      responses: { '200': { description: Actualizada } }
    delete: { tags: [Tendencias], summary: Eliminar, responses: { '204': { $ref: '#/components/responses/SinContenido' } } }
  /api/tendencias/{id}/menciones:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Tendencias]
      summary: Registrar una mención
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { fuente: { type: string }, fecha: { type: string, format: date } } }
      responses: { '201': { description: Mención registrada } }

  # ------------------------------------------------------------------ Calendario
  /api/calendario:
    get:
      tags: [Calendario]
      summary: Listar eventos (usa desde/hasta para la vista semanal o mensual)
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/q'
        - { name: tipo_evento, in: query, schema: { type: string } }
        - { name: modalidad, in: query, schema: { type: string } }
        - { name: orden, in: query, schema: { type: string, enum: [fecha, titulo] } }
        - $ref: '#/components/parameters/direccion'
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses: { '200': { $ref: '#/components/responses/Pagina' } }
    post:
      tags: [Calendario]
      summary: Crear (Gestor Calendario o administración)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Evento' } } } }
      responses: { '201': { description: Creado } }
  /api/calendario/exportar:
    get:
      tags: [Calendario]
      summary: Exportar
      parameters: [{ $ref: '#/components/parameters/formato' }]
      responses: { '200': { $ref: '#/components/responses/Archivo' } }
  /api/calendario/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { tags: [Calendario], summary: Detalle, responses: { '200': { description: Detalle } } }
    patch:
      tags: [Calendario]
      summary: Editar
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Evento' } } } }
      responses: { '200': { description: Actualizado } }
    delete: { tags: [Calendario], summary: Eliminar, responses: { '204': { $ref: '#/components/responses/SinContenido' } } }

  # ------------------------------------------------------------------ Estadísticas
  /api/actividad:
    post:
      tags: [Estadísticas]
      summary: Registrar una vista, clic en Acceder o compartir (cualquier perfil)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo_contenido, id_contenido, accion]
              properties:
                tipo_contenido: { type: string, enum: [Flash, Faro, Empresa, Tendencia, Evento] }
                id_contenido: { type: integer }
                accion: { type: string, enum: [Vista, Clic_acceder, Compartir] }
      responses: { '201': { description: Registrado } }
  /api/estadisticas/panel:
    get:
      tags: [Estadísticas]
      summary: Tarjetas del Panel con variación frente al mes anterior (Super Admin o Gestor Observatorio)
      description: Usuarios registrados, contenidos publicados (por módulo), visitas del mes y suscriptores a alertas.
      responses: { '200': { description: Panel } }
  /api/estadisticas/resumen:
    get: { tags: [Estadísticas], summary: Resumen del mes (Super Admin o Gestor Observatorio), responses: { '200': { description: Resumen } } }
  /api/estadisticas/top-contenidos:
    get: { tags: [Estadísticas], summary: Top 5 contenidos más vistos en 30 días (Super Admin o Gestor Observatorio), responses: { '200': { description: Top 5 } } }
  /api/estadisticas/modulos:
    get: { tags: [Estadísticas], summary: Actividad por módulo en 30 días (Super Admin o Gestor Observatorio), responses: { '200': { description: Módulos } } }
  /api/estadisticas/ciudades:
    get: { tags: [Estadísticas], summary: Usuarios por ciudad (Super Admin o Gestor Observatorio), responses: { '200': { description: Ciudades } } }
  /api/estadisticas/intereses:
    get: { tags: [Estadísticas], summary: Distribución de intereses (Super Admin o Gestor Observatorio), responses: { '200': { description: Intereses } } }

  # ------------------------------------------------------------------ Alertas
  /api/alertas/ejecutar:
    post:
      tags: [Alertas]
      summary: Ejecutar el envío de alertas ahora (Super Admin o Gestor Observatorio)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frecuencia]
              properties:
                frecuencia:
                  type: string
                  enum: [Recordatorios, Inmediata, Diaria, Semanal]
                  description: 'Recordatorios de eventos favoritos o el boletín de novedades de esa frecuencia.'
            example: { frecuencia: Recordatorios }
      responses: { '200': { description: 'Resultado: { enviados, errores }' } }
  /api/alertas/abierto/{id}/{firma}:
    get:
      tags: [Alertas]
      summary: Imagen invisible que marca un correo de alerta como abierto
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: firma, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: GIF 1x1 } }

  # ------------------------------------------------------------------ Búsqueda
  /api/buscar:
    get:
      tags: [Búsqueda]
      summary: Búsqueda global en Flash, Faro, Empresas, Tendencias y Eventos
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limite, in: query, description: Máximo por módulo, schema: { type: integer, default: 5, maximum: 20 } }
      responses:
        '200': { description: 'Resultados: { q, total, resultados: [{ tipo, id, titulo, detalle, fecha }] }' }
